name: Shared offline research CI audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out engine source
        uses: actions/checkout@v4
      - name: Check out pinned shared audit implementation
        uses: actions/checkout@v4
        with:
          repository: enriquespinoza/Systematic-Trading-Research-Platform
          ref: 0532fac27d99b408641ee7ea63a6fac8f6ad066d
          path: .audit-tool
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing dependencies and offline test isolation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install 'pytest-socket>=0.7,<1'
      - name: Run offline tests and generate hash-linked evidence
        run: |
          python .audit-tool/scripts/research_ci_audit.py --repo-root . --output-dir audit-output --engine-id stock-scanner --timeout-seconds 1800 --offline
      - name: Upload audit evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-scanner-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 90
